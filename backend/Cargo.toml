[package]
name = "backend"
version = "2.0.0"
edition = "2024"

[dependencies]
# 异步运行时
tokio = { version = "1", features = ["full"] }

# Web框架
axum = { version = "0.8", features = ["macros", "multipart", "tracing"] }
axum-extra = { version = "0.10.0", features = ["typed-header", "cookie"] }
axum-reverse-proxy = { version = "1.0.3", default-features = false }
tower = "0.5.2"
tower-http = { version = "0.6.2", features = ["cors", "trace", "compression-full"] }

# 数据库 (SeaORM)
sea-orm = { version = "1.1.0", default-features = false, features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
  "with-chrono",
  "with-json",
  "with-uuid",
] }
sea-orm-migration = "1.1.0"

# 序列化/反序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# 工具库
dotenv = "0.15"
uuid = { version = "1.6", features = ["v4", "serde"] }
thiserror = "2.0.12"
chrono = { version = "0.4.41", features = ["serde"] }
once_cell = "1.21.2"
toml = "0.8.8"
anyhow = "1"

# 认证
jsonwebtoken = "9.3.1"
bcrypt = "0.17.0"

# HTTP 客户端（LLM API 调用）
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
