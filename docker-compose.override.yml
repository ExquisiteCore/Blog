# Development override for docker-compose.yml
# This file is automatically loaded by docker-compose for development
# To use production settings, rename this file or use: docker-compose -f docker-compose.yml up

version: '3.8'

services:
  postgres:
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: dev_password_123
      POSTGRES_USER: postgres
      POSTGRES_DB: Blog_Dev
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  backend:
    build:
      context: ./backend
      target: runtime  # Use runtime stage for faster dev builds
    environment:
      - DATABASE__URL=postgres://postgres:dev_password_123@postgres:5432/Blog_Dev
      - JWT__SECRET=dev_jwt_secret_key_not_for_production_use_only
      - RUST_LOG=debug
      - RUST_BACKTRACE=1
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/config.dev.toml:/app/config.toml:ro
    ports:
      - "8080:8080"
      - "9229:9229"  # Debug port
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  frontend:
    build:
      context: ./blog-web
      target: builder  # Use builder stage for development
      args:
        PUBLIC_API_BASE_URL: "http://localhost:8080/api"
        INTERNAL_API_BASE_URL: "http://backend:8080/api"
        NODE_ENV: "development"
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - PORT=4321
    volumes:
      - ./blog-web/src:/app/src:ro
      - ./blog-web/public:/app/public:ro
    ports:
      - "4321:4321"
      - "24678:24678"  # Astro dev server HMR
    command: ["pnpm", "dev", "--host", "0.0.0.0"]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  # Development tools
  adminer:
    image: adminer:4.8.1
    container_name: blog-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - blog-network
    profiles:
      - tools

volumes:
  postgres_dev_data:
    driver: local