name: Rust Backend CI

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]
  release:
    types:
      - published  # 当发布版本时触发

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: backend
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  SQLX_OFFLINE: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cache SQLx metadata
        uses: actions/cache@v3
        with:
          path: backend/.sqlx
          key: ${{ runner.os }}-sqlx-${{ hashFiles('**/*.rs', '**/migrations/**') }}
          restore-keys: ${{ runner.os }}-sqlx-

      - name: Install SQLx CLI
        run: cargo install sqlx-cli --no-default-features --features postgres

      - name: Prepare SQLx metadata
        run: |
          cd backend
          cargo sqlx prepare -- --tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SQLX_OFFLINE: true

      - name: Run tests
        run: cd backend && cargo test --verbose

  build:
    name: Build ${{ matrix.target.name }}
    needs: test
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: backend
            asset_name: backend-linux-amd64
          - name: Linux ARM64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            bin: backend
            asset_name: backend-linux-arm64
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: backend.exe
            asset_name: backend-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: ${{ matrix.target.target }}
          override: true

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-${{ matrix.target.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target.target }}-cargo-

      - name: Cache SQLx metadata
        uses: actions/cache@v3
        with:
          path: backend/.sqlx
          key: ${{ runner.os }}-sqlx-${{ hashFiles('**/*.rs', '**/migrations/**') }}
          restore-keys: ${{ runner.os }}-sqlx-

      - name: Install SQLx CLI
        run: cargo install sqlx-cli --no-default-features --features postgres

      - name: Prepare SQLx metadata
        run: |
          cd backend
          cargo sqlx prepare -- --tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SQLX_OFFLINE: true

      - name: Build release binary
        run: |
          cd backend
          cargo build --release --target ${{ matrix.target.target }}

      - name: Prepare binary
        shell: bash
        run: |
          cd backend
          mkdir -p release
          cp target/${{ matrix.target.target }}/release/${{ matrix.target.bin }} release/${{ matrix.target.asset_name }}

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.asset_name }}
          path: backend/release/${{ matrix.target.asset_name }}
          if-no-files-found: error

  update-release-notes:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract release notes
        id: extract-release-notes
        uses: ffurrer2/extract-release-notes@v2

      - uses: softprops/action-gh-release@v2
        with:
          body: |-
            ${{ steps.extract-release-notes.outputs.release_notes }}
            | File | SHA256 |
            | ---- | ------ |

  upload-to-release:
    needs:
      - build
      - update-release-notes
    permissions:
      contents: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode:
          - debug
          - release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.target.asset_name }}
          path: artifact

      - run: |
          zip -r ../${{ matrix.asset_name }} *
        working-directory: artifact

      - id: calculate-sha256
        run: |
          echo sha256=$(sha256sum ${{ matrix.asset_name }} | awk '{print $1}') >> $GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v2
        with:
          append_body: true
          body: |-
            | ${{ matrix.asset_name }} | ${{ steps.calculate-sha256.outputs.sha256 }} |
          files: |
            ${{ matrix.asset_name }}
