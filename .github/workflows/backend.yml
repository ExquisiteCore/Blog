name: Rust Backend CI

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: backend
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  # Enable SQLx offline mode to avoid requiring a database connection during compilation
  SQLX_OFFLINE: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Install SQLx CLI
        run: cargo install sqlx-cli --no-default-features --features postgres
      - name: Create .sqlx directory if it doesn't exist
        run: mkdir -p backend/.sqlx
      - name: Generate SQLx metadata
        run: cd backend && cargo sqlx prepare -- --tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SQLX_OFFLINE: true
      - name: Run tests
        run: cd backend && cargo test --verbose

  build:
    name: Build ${{ matrix.target.name }}
    needs: test
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: Linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: backend
            asset_name: backend-linux-amd64
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: backend.exe
            asset_name: backend-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: ${{ matrix.target.target }}
          override: true

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-${{ matrix.target.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target.target }}-cargo-

      - name: Create .sqlx directory if it doesn't exist
        run: mkdir -p backend/.sqlx

      - name: Generate SQLx metadata
        run: cd backend && cargo sqlx prepare -- --tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SQLX_OFFLINE: true

      - name: Build release binary
        run: |
          cd backend
          cargo build --release --target ${{ matrix.target.target }}

      - name: Prepare binary
        shell: bash
        run: |
          cd backend
          mkdir -p release
          if [ "${{ matrix.target.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target.target }}/release/${{ matrix.target.bin }} release/${{ matrix.target.asset_name }}
          else
            cp target/${{ matrix.target.target }}/release/${{ matrix.target.bin }} release/${{ matrix.target.asset_name }}
          fi

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.asset_name }}
          path: backend/release/${{ matrix.target.asset_name }}
          if-no-files-found: error

  create-release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/backend-linux-amd64/backend-linux-amd64
            artifacts/backend-windows-amd64.exe/backend-windows-amd64.exe
          draft: false
          prerelease: false
