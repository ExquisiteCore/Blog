name: Docker 镜像发布

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-push:
    name: 构建并推送 Docker 镜像
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 将仓库名转为小写，设置环境变量
        run: echo "REPOSITORY_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录到 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN }}

      - name: 提取元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ env.REPOSITORY_LOWER }}/backend
            ghcr.io/${{ env.REPOSITORY_LOWER }}/frontend
          tags: |
            type=ref,event=branch
            type=sha,format=short

      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ env.REPOSITORY_LOWER }}/backend:${{ steps.meta.outputs.tags }}
            ghcr.io/${{ env.REPOSITORY_LOWER }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建并推送前端镜像
        uses: docker/build-push-action@v5
        with:
          context: ./blog-web
          push: true
          tags: |
            ghcr.io/${{ env.REPOSITORY_LOWER }}/frontend:${{ steps.meta.outputs.tags }}
            ghcr.io/${{ env.REPOSITORY_LOWER }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PUBLIC_API_BASE_URL=http://localhost:8080/api
            INTERNAL_API_BASE_URL=http://backend:8080/api

      - name: 更新 Docker Compose 文件
        run: |
          # 取第一个标签（通常是 branch 或 sha 短哈希）
          VERSION=$(echo "${{ steps.meta.outputs.tags }}" | cut -d',' -f1)
          sed -i "s|build:\s*context: ./backend|image: ghcr.io/${REPOSITORY_LOWER}/backend:${VERSION}|g" docker-compose.yml
          sed -i "s|build:\s*context: ./blog-web|image: ghcr.io/${REPOSITORY_LOWER}/frontend:${VERSION}|g" docker-compose.yml
        env:
          REPOSITORY_LOWER: ${{ env.REPOSITORY_LOWER }}

      - name: 创建 Docker Compose 发布文件
        run: cp docker-compose.yml docker-compose.release.yml

      - name: 上传 Docker Compose 文件作为发布资产
        uses: softprops/action-gh-release@v1
        with:
          files: docker-compose.release.yml
          token: ${{ secrets.TOKEN }}
