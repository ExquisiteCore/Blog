name: Docker 镜像发布

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: 设置小写仓库名变量
        run: echo "REPOSITORY_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN }}

      - name: 提取元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ env.REPOSITORY_LOWER }}/backend
            ghcr.io/${{ env.REPOSITORY_LOWER }}/frontend
          tags: |
            type=ref,event=branch
            type=sha,format=short

      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }},ghcr.io/${{ env.REPOSITORY_LOWER }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建并推送前端镜像
        uses: docker/build-push-action@v5
        with:
          context: ./blog-web
          push: true
          tags: ${{ steps.meta.outputs.tags }},ghcr.io/${{ env.REPOSITORY_LOWER }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PUBLIC_API_BASE_URL=http://localhost:8080/api
            INTERNAL_API_BASE_URL=http://backend:8080/api

      - name: 更新 Docker Compose 文件
        run: |
          VERSION=$(echo "${{ steps.meta.outputs.tags }}" | cut -d',' -f1)
          sed -i "s|build:\s*context: ./backend|image: ghcr.io/${REPOSITORY_LOWER}/backend:${VERSION}|g" docker-compose.yml
          sed -i "s|build:\s*context: ./blog-web|image: ghcr.io/${REPOSITORY_LOWER}/frontend:${VERSION}|g" docker-compose.yml
        env:
          REPOSITORY_LOWER: ${{ env.REPOSITORY_LOWER }}

      - run: cp docker-compose.yml docker-compose.release.yml

      - uses: softprops/action-gh-release@v1
        with:
          files: docker-compose.release.yml
          token: ${{ secrets.TOKEN }}
